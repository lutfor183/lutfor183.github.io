name: Update job circulars
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pycryptodome
      - run: python3 img/j/build_posts.py --max 400
        env:
          JC_PASS: ${{ secrets.JC_PASS }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add img/j/posts.enc.json img/j/build_posts.py img/j/index.html
          git diff --cached --quiet || git commit -m "Update circulars $(date -u +%F)"
          git push
