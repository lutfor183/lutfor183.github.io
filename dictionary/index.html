<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dictionary — Lutfor</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500&display=swap');
*{font-family:Inter,'Noto Sans Bengali',system-ui}
#suggest:empty{display:none}
</style>
</head>
<body class="bg-white text-zinc-800">
<header class="border-b sticky top-0 bg-white">
  <div class="max-w-2xl mx-auto px-4 py-4 flex items-center gap-4">
    <a href="../" class="font-semibold text-sm">Lutfor</a>
    <div class="flex-1 relative">
      <input id="q" type="text" autocomplete="off" placeholder="Search word..." class="w-full border rounded-full px-4 py-2 text-sm outline-none focus:border-zinc-900">
      <div id="suggest" class="absolute left-0 right-0 mt-2 bg-white border rounded-xl shadow-lg overflow-hidden divide-y max-h-72 overflow-auto"></div>
    </div>
    <select id="pair" class="border rounded-full px-3 py-2 text-sm">
      <option value="en-bn">en-bn</option>
      <option value="bn-en">bn-en</option>
      <option value="bn-bn">bn-bn</option>
    </select>
  </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-6">
  <div class="flex gap-2 text-xs text-zinc-500">
    <span>78k words</span><span>•</span><span>20 results limit</span><span>•</span><span>Worker hidden</span>
  </div>
  <div id="results" class="mt-6 space-y-3"></div>
  <div id="empty" class="hidden text-sm text-zinc-500 mt-6">No results. Try other pair.</div>
</main>

<script src="app.js"></script>
</body>
</html>
