<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dictionary</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
*{font-family:Inter,system-ui}
.glow{box-shadow:0 0 40px rgba(124,58,237,0.15),0 0 80px rgba(236,72,153,0.12)}
#suggest:empty{display:none}
</style>
</head>
<body class="bg-[#fbfaf8] min-h-screen flex flex-col">
<header class="border-b bg-white">
  <div class="max-w-2xl mx-auto px-4 py-4 flex justify-between items-center">
    <a href="../" class="font-semibold text-sm">Lutfor</a>
    <a href="../" class="text-sm text-zinc-600 hover:underline">Home</a>
  </div>
</header>
<main class="flex-1 flex flex-col items-center px-4 pt-16">
  <h1 class="text-2xl font-semibold">Dictionary</h1>
  <div class="w-full max-w-xl mt-8 relative">
    <div class="glow rounded-full bg-white border p-2">
      <input id="q" type="text" autocomplete="off" placeholder="Type a word..." class="w-full px-4 py-2 text-sm outline-none bg-transparent">
    </div>
    <div id="suggest" class="absolute left-0 right-0 mt-3 bg-white border rounded-2xl shadow-xl overflow-hidden divide-y max-h-72 overflow-auto z-10"></div>
  </div>
  <div id="results" class="w-full max-w-xl mt-8 space-y-3"></div>
  <div id="status" class="text-sm text-zinc-500 mt-6"></div>
</main>
<script src="app.js"></script>
</body>
</html>
